<!DOCTYPE html>
<html>

<head>
  <title>Space InvaderZ</title>
  <!-- The ./ stops Vite's build reading these as package names. -->
  <link href="./css/core.css" type="text/css" rel="stylesheet">
  <link href="./css/typeography.css" type="text/css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div id="starfield"></div>
  <div id="gamecontainer">
    <canvas id="gameCanvas"></canvas>
  </div>
  <div id="info">
    <p>Move with arrow keys or swipe, fire with the space bar or touch. The invaderz get faster and drop
      more bombs as you complete each level!</p>
    <p><a id="muteLink" href="#" onclick="toggleMute()">mute</a></p>
  </div>
  
  <script src="js/starfield.js"></script>
  <script src="js/spaceinvaders.js"></script>
  <script>
    //  Create the starfield.
    var container = document.getElementById('starfield');
    var starfield = new Starfield();
    starfield.initialise(container);
    starfield.start();

    //  Setup the canvas.
    var canvas = document.getElementById("gameCanvas");
    canvas.width = 800;
    canvas.height = 600;

    //  Create the game.
    var game = new Game();

    //  Initialise it with the game canvas.
    game.initialise(canvas);

    //  Start the game.
    game.start();

    //  Listen for keyboard events.
    window.addEventListener("keydown", function keydown(e) {
      var keycode = e.which || window.event.keycode;
      //  Supress further processing of left/right/space (37/29/32)
      if (keycode == 37 || keycode == 39 || keycode == 32) {
        e.preventDefault();
      }
      game.keyDown(keycode);

    });
    window.addEventListener("keyup", function keydown(e) {
      var keycode = e.which || window.event.keycode;
      game.keyUp(keycode);
    });

    window.addEventListener("touchstart", function (e) {
      game.touchstart(e);
    }, false);

    window.addEventListener('touchend', function (e) {
      game.touchend(e);
    }, false);

    window.addEventListener('touchmove', function (e) {
      game.touchmove(e);
    }, false);

    function toggleMute() {
      game.mute();
      document.getElementById("muteLink").innerText = game.sounds.mute ? "unmute" : "mute";
    }
  </script>
</body>

</html>
